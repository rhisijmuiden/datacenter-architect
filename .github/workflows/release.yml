name: Release

# Publish a build that the in-game updater can find, either by pushing a tag or
# by running this workflow from the Actions tab on the test or main branch:
#   v0.2.0-test.1  -> pre-release on the test channel (from the test branch)
#   v0.2.0         -> release on the stable channel (from main)
# Every release carries a Windows installer and a macOS build (a universal .app for Intel and Apple Silicon, as .dmg
# for people and as .zip for the in-game updater), each with a .sha256 file. "dry_run" builds and tests both on any
# branch without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 0.2.0-test.1 (test) or 0.2.0 (stable)"
        required: true
      dry_run:
        description: "Only build and test (any branch), publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.5.1
  # from https://github.com/godotengine/godot/releases/download/4.5.1-stable/SHA512-SUMS.txt; update together with the version
  GODOT_WIN_SHA512: 168fb2502fe979f7a2258d036cae9e5d6a32c96263fe9193a3e34e2be60d5024732a28f713b1ce3f962a74b731a72b1501df891e80bc97ddc1638191199b8a13
  GODOT_MAC_SHA512: c990da4273e67be501e05276e68f266fd2175f72d2af5f149c334eaf6f8b79bf09d803c98cc36313725750940f6fa8f274bda90d08ffaa1e8682ddf96dd6c871
  GODOT_TEMPLATES_SHA512: 5f4379634ca1cfc176a30da1ca5cee4407cdce0da18e1f60de12a3e7bf497f91b7e525479d90a8c13feaa4bee6a592b4ea332c81ac31501bf76f01804afe76ba

jobs:
  # checks the version once; every build job stamps the same version and channel
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - id: v
        env:
          # passed as data, never pasted into the script, so a version text cannot run commands
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then ver="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"; else ver="$REF_NAME"; fi
          ver="${ver#v}"
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-test\.[0-9]+)?$'; then echo "version '$ver' must look like 1.2.3 or 1.2.3-test.4"; exit 1; fi
          case "$ver" in *-*) channel=test; want=test;; *) channel=stable; want=main;; esac
          # a stable release comes from main, a test release from test (or a tag on them); a dry run may use any branch
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then
            if [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "$want" ]; then echo "a $channel release must be run from the $want branch, not $REF_NAME"; exit 1; fi
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Version $ver on the $channel channel"

  windows:
    runs-on: windows-latest
    needs: prepare
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Stamp version and channel
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          (Get-Content game/project.godot) `
            -replace 'config/version=".*"', "config/version=`"$env:VERSION`"" `
            -replace 'build/channel=".*"', "build/channel=`"$env:CHANNEL`"" |
            Set-Content game/project.godot

      - name: Download Godot and export templates
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_win64.zip" -OutFile godot.zip
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_export_templates.tpz" -OutFile templates.zip
          # both downloads must match the checksums Godot publishes and we pin here
          if ((Get-FileHash godot.zip -Algorithm SHA512).Hash -ne $env:GODOT_WIN_SHA512) { throw "Godot download checksum mismatch" }
          if ((Get-FileHash templates.zip -Algorithm SHA512).Hash -ne $env:GODOT_TEMPLATES_SHA512) { throw "export templates checksum mismatch" }
          Expand-Archive godot.zip -DestinationPath godot
          Expand-Archive templates.zip -DestinationPath tpl
          $dest = "$env:APPDATA\Godot\export_templates\$env:GODOT_VERSION.stable.mono"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item tpl/templates/* $dest
          $exe = Get-ChildItem godot -Recurse -Filter "*_console.exe" | Select-Object -First 1
          "GODOT=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV

      - name: Import, test and export
        shell: pwsh
        run: |
          & $env:GODOT --headless --path game --import
          dotnet build game/DatacenterArchitect.csproj
          & $env:GODOT --headless --path game -- --run-tests
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }
          New-Item -ItemType Directory -Force build | Out-Null
          & $env:GODOT --headless --path game --export-release "Windows Desktop" ../build/DatacenterArchitect.exe
          if (!(Test-Path build/DatacenterArchitect.exe)) { throw "export failed" }
          # a C# export without its .NET data folder starts and crashes immediately
          if (!(Test-Path build/data_DatacenterArchitect_windows_x86_64/DatacenterArchitect.dll)) { throw "export is missing the .NET assemblies (data_DatacenterArchitect_windows_x86_64)" }
          if (!(Test-Path build/data_DatacenterArchitect_windows_x86_64/GodotSharp.dll)) { throw "export is missing GodotSharp.dll" }
          Get-ChildItem build -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { "build size: {0:N0} bytes in {1} files" -f $_.Sum, $_.Count }

      - name: Smoke test the exported game
        shell: pwsh
        run: |
          # start the real exported build headless and run the test suite inside it
          $p = Start-Process build/DatacenterArchitect.exe -ArgumentList "--headless","--","--run-tests" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exported game failed its self-test (exit $($p.ExitCode))" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y; }
          & $iscc "/DAppVersion=$env:VERSION" installer/DatacenterArchitect.iss
          if ($LASTEXITCODE -ne 0) { throw "installer failed" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: dist/DatacenterArchitect-${{ env.VERSION }}-Setup.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Stamp version and channel
        run: |
          sed -i '' -e "s/^config\/version=\".*\"/config\/version=\"$VERSION\"/" -e "s/^build\/channel=\".*\"/build\/channel=\"$CHANNEL\"/" game/project.godot
          grep -E '^(config/version|build/channel)=' game/project.godot

      - name: Download Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSfLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          curl -sSfLo templates.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          # both downloads must match the checksums Godot publishes and we pin here
          echo "${GODOT_MAC_SHA512}  godot.zip" | shasum -a 512 -c -
          echo "${GODOT_TEMPLATES_SHA512}  templates.zip" | shasum -a 512 -c -
          ditto -x -k godot.zip godot
          unzip -q templates.zip -d tpl
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$dest"
          mv tpl/templates/* "$dest/"
          echo "GODOT=$PWD/godot/Godot_mono.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Import, test and export
        run: |
          "$GODOT" --headless --path game --import || true
          dotnet build game/DatacenterArchitect.csproj
          "$GODOT" --headless --path game -- --run-tests
          mkdir -p build/mac
          "$GODOT" --headless --path game --export-release "macOS" "../build/mac/Datacenter Architect.app"
          app="build/mac/Datacenter Architect.app"
          test -d "$app/Contents/MacOS" || { echo "export failed"; exit 1; }
          # a C# export without its .NET assemblies starts and crashes immediately
          find "$app/Contents/Resources" -name DatacenterArchitect.dll | grep -q . || { echo "export is missing DatacenterArchitect.dll"; exit 1; }
          find "$app/Contents/Resources" -name GodotSharp.dll | grep -q . || { echo "export is missing GodotSharp.dll"; exit 1; }
          bin="$(find "$app/Contents/MacOS" -type f -perm -u+x | head -n 1)"
          lipo -archs "$bin" | tee /dev/stderr | grep -q arm64 || { echo "not a universal build"; exit 1; }
          lipo -archs "$bin" | grep -q x86_64 || { echo "not a universal build"; exit 1; }
          du -sh "$app"

      - name: Sign ad hoc
        run: |
          # no Apple Developer ID yet: an ad-hoc signature lets Apple Silicon run the app; Gatekeeper still asks once
          app="build/mac/Datacenter Architect.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Smoke test the exported game
        run: |
          # start the real exported build headless and run the test suite inside it
          bin="$(find "build/mac/Datacenter Architect.app/Contents/MacOS" -type f -perm -u+x | head -n 1)"
          "$bin" --headless -- --run-tests

      - name: Package zip and dmg
        run: |
          mkdir -p dist
          app="build/mac/Datacenter Architect.app"
          # the in-game updater downloads the zip; people download the dmg
          ditto -c -k --keepParent "$app" "dist/DatacenterArchitect-$VERSION-macOS.zip"
          mkdir -p dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Datacenter Architect" -srcfolder dmg -ov -format UDZO "dist/DatacenterArchitect-$VERSION-macOS.dmg"
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, windows, macos]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # only this job may create the release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          cd dist
          # the in-game updater checks each download against this SHA-256 (and GitHub's own asset digest)
          files=""
          for f in "DatacenterArchitect-$VERSION-Setup.exe" "DatacenterArchitect-$VERSION-macOS.zip" "DatacenterArchitect-$VERSION-macOS.dmg"; do
            test -f "$f" || { echo "missing $f"; exit 1; }
            sha256sum "$f" | tr -d '\n' > "$f.sha256"
            cat "$f.sha256"; echo
            files="$files $f $f.sha256"
          done
          pre=""; if [ "$CHANNEL" = "test" ]; then pre="--prerelease"; fi
          # shellcheck disable=SC2086
          gh release create "v$VERSION" $files --repo "$GITHUB_REPOSITORY" --title "Datacenter Architect $VERSION" --generate-notes --target "$SHA" $pre
