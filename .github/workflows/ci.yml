name: CI

on:
  push:
    branches: [test, main]
  pull_request:

env:
  GODOT_VERSION: 4.5.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download Godot (.NET)
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d godot
          echo "GODOT=$(ls $PWD/godot/*/Godot_v*_mono_linux.x86_64)" >> "$GITHUB_ENV"
      - name: Import project
        run: $GODOT --headless --path game --import || true
      - name: Build C#
        run: dotnet build game/DatacenterArchitect.csproj
      - name: Run tests
        run: $GODOT --headless --path game -- --run-tests
