<title>Datacenter Architect Room Designer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen 3D build grid. Tools on the left (house rule), room checklist on the right, stats on top, tool hint at the bottom. Single dark-panel game look. */
:root {
  --panel: rgba(17, 29, 43, 0.9);
  --panel-solid: #142334;
  --panel-hi: #1d3247;
  --line: rgba(150, 190, 220, 0.18);
  --ink: #eaf2f8;
  --ink-dim: #93a9bc;
  --brand: #ffb23e;
  --cool: #55d2f2;
  --fiber: #ff7a2f;
  --ok: #5fd49b;
  --bad: #ff6b5e;
  --sky: #a8d6f2;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(5, 12, 20, 0.35); }
.label { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; color: var(--ink-dim); font-weight: 600; }

.top { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand h1 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.brand .sub { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
.stats { display: flex; flex-wrap: wrap; }
.stat { padding: 8px 14px; border-right: 1px solid var(--line); display: grid; gap: 3px; min-width: 110px; }
.stat:last-child { border-right: 0; }
.stat .v { font-family: var(--display); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.stat .v small { font-size: 12px; color: var(--ink-dim); font-weight: 500; }
.bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.right-tools { margin-left: auto; display: flex; gap: 4px; padding: 4px; align-items: center; }
.right-tools button { min-width: 38px; height: 36px; padding: 0 10px; border-radius: 7px; font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--ink-dim); display: grid; place-items: center; }
.right-tools button:hover { color: var(--ink); background: var(--panel-hi); }
.right-tools button.on { color: var(--brand); background: var(--panel-hi); }
.right-tools svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.tools { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: 84px; bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 220px; padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tgrid button { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 7px; font-size: 13.5px; font-weight: 500; color: var(--ink-dim); text-align: left; }
.tgrid button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tgrid button:hover { background: var(--panel-hi); color: var(--ink); }
.tgrid button.on { background: var(--panel-hi); color: var(--ink); box-shadow: inset 3px 0 0 var(--brand); }
.sep { height: 1px; background: var(--line); margin: 2px 4px; flex: none; }
.palette { overflow-y: auto; display: grid; gap: 2px; padding-right: 2px; min-height: 0; }
.palette button { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 7px; font-size: 13.5px; color: var(--ink-dim); text-align: left; }
.palette button:hover { background: var(--panel-hi); color: var(--ink); }
.palette button.on { background: var(--panel-hi); color: var(--ink); box-shadow: inset 3px 0 0 var(--brand); }
.palette .sw { width: 14px; height: 14px; border-radius: 4px; flex: none; border: 1px solid rgba(255,255,255,0.2); }
.palette small { margin-left: auto; color: var(--ink-dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }

.rooms { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: 84px; width: 290px; max-height: calc(100% - 170px); padding: 12px; display: grid; gap: 8px; overflow-y: auto; align-content: start; }
.room { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: grid; gap: 5px; cursor: pointer; background: rgba(255,255,255,0.02); }
.room:hover { border-color: rgba(255,178,62,0.5); }
.room.sel { border-color: var(--brand); }
.room .hd { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.room .hd .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.room .hd small { margin-left: auto; font-weight: 500; color: var(--ink-dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.pill { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; }
.pill.ok { background: rgba(95,212,155,0.18); color: var(--ok); }
.pill.bad { background: rgba(255,107,94,0.18); color: var(--bad); }
.pill.warn { background: rgba(255,178,62,0.18); color: var(--brand); }
.room ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-dim); }
.room li { display: flex; gap: 6px; align-items: baseline; }
.room li b { width: 14px; flex: none; text-align: center; font-weight: 700; }
.room li.ok b { color: var(--ok); }
.room li.bad b { color: var(--bad); }
.room li.warn b { color: var(--brand); }

.hintbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; max-width: calc(100% - 560px); }
.hintbar .k { font-family: var(--display); font-weight: 700; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--ink); }
.hintbar button { padding: 6px 10px; border-radius: 6px; background: var(--panel-hi); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.hintbar span { min-width: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 70px; padding: 9px 14px; font-size: 13.5px; border-radius: 9px; background: var(--panel-solid); border: 1px solid var(--brand); }

@media (max-width: 1100px) {
  .hintbar { max-width: calc(100% - 24px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); transform: none; bottom: auto; top: 140px; }
  .rooms { width: 240px; }
}
@media (max-width: 760px) {
  .tools { width: 160px; }
  .tgrid { grid-template-columns: 1fr; }
  .rooms { top: auto; bottom: max(12px, env(safe-area-inset-bottom, 0px)); max-height: 34%; width: calc(100% - 196px); }
  .stat:nth-child(n+3) { display: none; }
  .brand .sub { display: none; }
  .hintbar { display: none; }
}
</style>

<canvas id="c" aria-label="Room designer build grid"></canvas>

<div class="top">
  <div class="panel brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="3" width="34" height="34" rx="8" fill="#ffb23e"/><rect x="10" y="9" width="20" height="5" rx="1.5" fill="#142334"/><rect x="10" y="17" width="20" height="5" rx="1.5" fill="#142334"/><rect x="10" y="25" width="20" height="5" rx="1.5" fill="#142334"/><circle cx="26.5" cy="11.5" r="1.3" fill="#5fd49b"/><circle cx="26.5" cy="19.5" r="1.3" fill="#5fd49b"/><circle cx="26.5" cy="27.5" r="1.3" fill="#ffb23e"/></svg>

    <div class="stat"><span class="label" data-i="sUps">UPS load</span><div class="v" id="vUps">0%</div><div class="bar"><i id="bUps" style="background:var(--brand)"></i></div></div>
    <div class="stat"><span class="label" data-i="sCost">Build cost</span><div class="v" id="vCost">€ 0</div></div>

  <div class="panel right-tools">
    <button id="walls" class="on" title="Walls high / low" aria-label="Walls high or low"><svg viewBox="0 0 24 24"><path d="M4 20V8h16v12"/><path d="M4 12h16"/></svg></button>
    <button id="rotL" title="Rotate view (Q)" aria-label="Rotate view left"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v5h5"/></svg></button>
    <button id="rotR" title="Rotate view (E)" aria-label="Rotate view right"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
    <button id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="lang">NL</button>
  </div>
</div>

<nav class="panel tools" aria-label="Build tools">
  <span class="label" data-i="tTools">Tools</span>
  <div class="tgrid" id="toolGrid"></div>
  <div class="sep"></div>
  <span class="label" id="palTitle"></span>
  <div class="palette" id="palette"></div>
</nav>

<aside class="panel rooms" aria-label="Rooms">
  <span class="label" data-i="rTitle">Rooms and requirements</span>
  <div id="roomList" style="display:grid;gap:8px"></div>
</aside>

<div class="panel hintbar" id="hintbar"><span id="hintTxt"></span><button id="rotObj" hidden data-i="rotate">Rotate (R)</button></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(() => {
// ---------------- text ----------------
const T = {
  en: { sub: "AMS-01 · Ground floor", sRooms: "Rooms OK", sCool: "Hall cooling", sUps: "UPS load", sCost: "Build cost", tTools: "Tools", rTitle: "Rooms and requirements", rotate: "Rotate (R)",
    tools: { select: "Inspect", wall: "Wall", door: "Door", room: "Room", object: "Object", erase: "Erase" },
    palRoom: "Room type", palObj: "Objects", palNone: "Tip",
    hints: { select: "Click a room on the grid or in the list to see what it still needs.", wall: "Drag to draw a wall. Walls snap to straight lines.", door: "Click a wall to place or remove a door. Rooms need a door to be reachable.", room: "Drag a rectangle to mark the floor as this room type.", object: "Click to place. <span class='k'>R</span> rotates. Red means the spot is blocked.", erase: "Drag over walls, objects and floor to remove them." },
    tipText: "Pick a tool above. Start with walls, add doors, mark rooms, then furnish them.",
    area: "Area", min: "min.", door: "Has a door", needs: "Needs", cooling: "Cooling", of: "of", none: "No rooms yet. Use the Room tool to mark one.",
    undo: "Undone", blocked: "That spot is blocked", saved: "Room complete: {r}", invalid: "Draw inside the building" },
  nl: { sub: "AMS-01 · Begane grond", sRooms: "Ruimtes OK", sCool: "Koeling zaal", sUps: "UPS-belasting", sCost: "Bouwkosten", tTools: "Gereedschap", rTitle: "Ruimtes en eisen", rotate: "Draaien (R)",
    tools: { select: "Bekijken", wall: "Muur", door: "Deur", room: "Ruimte", object: "Object", erase: "Gum" },
    palRoom: "Ruimtetype", palObj: "Objecten", palNone: "Tip",
    hints: { select: "Klik op een ruimte op het grid of in de lijst om te zien wat er nog nodig is.", wall: "Sleep om een muur te tekenen. Muren lopen altijd recht.", door: "Klik op een muur om een deur te plaatsen of weg te halen. Een ruimte heeft een deur nodig.", room: "Sleep een rechthoek om de vloer als dit ruimtetype te markeren.", object: "Klik om te plaatsen. <span class='k'>R</span> draait. Rood betekent dat de plek bezet is.", erase: "Sleep over muren, objecten en vloer om ze weg te halen." },
    tipText: "Kies hierboven gereedschap. Begin met muren, zet er deuren in, markeer ruimtes en richt ze in.",
    area: "Oppervlak", min: "min.", door: "Heeft een deur", needs: "Nodig", cooling: "Koeling", of: "van", none: "Nog geen ruimtes. Gebruik het gereedschap Ruimte om er een te markeren.",
    undo: "Ongedaan gemaakt", blocked: "Die plek is bezet", saved: "Ruimte compleet: {r}", invalid: "Teken binnen het gebouw" }
};
let lang = "en";
const t = () => T[lang];

const ROOMS = {
  datahall: { c: "#8fa3b3", en: "Data hall", nl: "Datazaal", min: 24, need: { rack: 1, crah: 1 }, door: true },
  mmr: { c: "#f0a070", en: "Meet-me room", nl: "Meet-me room", min: 6, need: { odf: 1 }, door: true },
  ups: { c: "#f2c06e", en: "UPS room", nl: "UPS-ruimte", min: 6, need: { ups: 1 }, door: true },
  battery: { c: "#d9b26a", en: "Battery room", nl: "Accuruimte", min: 4, need: { battery: 1 }, door: true },
  switchgear: { c: "#e8d08a", en: "Switchgear room", nl: "Switchgear-ruimte", min: 6, need: { switchgear: 1 }, door: true },
  reception: { c: "#c9a77d", en: "Reception hall", nl: "Ontvangsthal", min: 10, need: { counter: 1, sofa: 1 }, door: true },
  security: { c: "#6f86b0", en: "Security", nl: "Beveiliging", min: 6, need: { counter: 1, gate: 1 }, door: true },
  customer: { c: "#93b07a", en: "Customer room", nl: "Klantenruimte", min: 6, need: { desk: 1 }, door: true },
  noc: { c: "#7d8fb8", en: "NOC", nl: "NOC", min: 8, need: { desk: 2, screens: 1 }, door: true },
  storage: { c: "#c4a07a", en: "Storage", nl: "Opslag", min: 6, need: { shelf: 1 }, door: true },
  dock: { c: "#b9bfc5", en: "Loading dock", nl: "Laadperron", min: 12, need: { dockdoor: 1 }, door: true },
  corridor: { c: "#dfe3e6", en: "Corridor", nl: "Gang", min: 0, need: {}, door: false }
};
const OBJS = {
  rack: { en: "Rack (42U)", nl: "Rack (42U)", w: 1, d: 1, cost: 4200, kw: 6 },
  crah: { en: "CRAH unit", nl: "CRAH-unit", w: 1, d: 2, cost: 38000, cool: 120 },
  ups: { en: "UPS 500 kW", nl: "UPS 500 kW", w: 2, d: 1, cost: 95000, ups: 500 },
  battery: { en: "Battery cabinet", nl: "Accukast", w: 1, d: 1, cost: 22000 },
  switchgear: { en: "Switchgear + ATS", nl: "Switchgear + ATS", w: 2, d: 1, cost: 120000 },
  odf: { en: "ODF / carrier rack", nl: "ODF / providerrack", w: 1, d: 1, cost: 6500 },
  desk: { en: "Desk", nl: "Bureau", w: 2, d: 1, cost: 900 },
  screens: { en: "Screen wall", nl: "Schermwand", w: 3, d: 1, cost: 18000 },
  counter: { en: "Counter", nl: "Balie", w: 2, d: 1, cost: 3500 },
  sofa: { en: "Sofa", nl: "Bank", w: 2, d: 1, cost: 1200 },
  gate: { en: "Security gate", nl: "Toegangspoortje", w: 1, d: 1, cost: 14000 },
  shelf: { en: "Shelving", nl: "Stelling", w: 2, d: 1, cost: 800 },
  dockdoor: { en: "Dock door", nl: "Laaddeur", w: 3, d: 1, cost: 16000 },
  plant: { en: "Plant", nl: "Plant", w: 1, d: 1, cost: 150 }
};
const COST = { wall: 650, door: 1800, floor: 120 };

// ---------------- grid state ----------------
const GW = 32, GH = 22;
let cells, objects;
function blank() { cells = Array.from({ length: GH }, () => Array.from({ length: GW }, () => ({ wall: 0, room: null, inside: false }))); objects = []; }
const BX0 = 1, BX1 = 30, BZ0 = 1, BZ1 = 20; // building outline (outer walls on these cells)
function inBuilding(i, j) { return i >= BX0 && i <= BX1 && j >= BZ0 && j <= BZ1; }
function setWallLine(i0, j0, i1, j1, v = 1) { const di = Math.sign(i1 - i0), dj = Math.sign(j1 - j0); let i = i0, j = j0; while (true) { cells[j][i].wall = v; if (i === i1 && j === j1) break; i += di; j += dj; } }
function fillRoom(i0, j0, i1, j1, type) { for (let j = Math.min(j0, j1); j <= Math.max(j0, j1); j++) for (let i = Math.min(i0, i1); i <= Math.max(i0, i1); i++) if (!cells[j][i].wall) cells[j][i].room = type; }
function addObj(type, i, j, rot = 0) { objects.push({ type, i, j, rot }); }
function example() {
  blank();
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) cells[j][i].inside = inBuilding(i, j);
  setWallLine(BX0, BZ0, BX1, BZ0); setWallLine(BX0, BZ1, BX1, BZ1); setWallLine(BX0, BZ0, BX0, BZ1); setWallLine(BX1, BZ0, BX1, BZ1);
  // internal walls
  setWallLine(1, 11, 30, 11);            // halls | support
  setWallLine(19, 1, 19, 11);            // data hall | technical
  setWallLine(19, 6, 30, 6);             // ups | mmr
  setWallLine(25, 1, 25, 6);             // ups | battery
  setWallLine(8, 11, 8, 20);             // dock | corridor
  setWallLine(8, 15, 30, 15);            // corridor | front rooms
  setWallLine(14, 15, 14, 20); setWallLine(21, 15, 21, 20); setWallLine(26, 15, 26, 20);
  // doors
  [[10, 11], [24, 11], [28, 6], [22, 6], [8, 13], [12, 15], [17, 15], [23, 15], [28, 15], [17, 20], [4, 20], [5, 20], [6, 20], [16, 11]].forEach(([i, j]) => cells[j][i].wall = 2);
  cells[3][19].wall = 2;
  // rooms
  fillRoom(2, 2, 18, 10, "datahall"); fillRoom(20, 2, 24, 5, "ups"); fillRoom(26, 2, 29, 5, "battery");
  fillRoom(20, 7, 29, 10, "mmr"); fillRoom(2, 12, 7, 19, "dock"); fillRoom(9, 12, 29, 14, "corridor");
  fillRoom(9, 16, 13, 19, "security"); fillRoom(15, 16, 20, 19, "reception"); fillRoom(22, 16, 25, 19, "customer"); fillRoom(27, 16, 29, 19, "noc");
  // data hall: racks + CRAH (cooling deliberately tight)
  for (const z of [3, 4, 7, 8]) for (let i = 5; i <= 16; i++) if (!(z === 8 && i > 13)) addObj("rack", i, z, (z === 3 || z === 7) ? 2 : 0);
  addObj("crah", 2, 3, 0); addObj("crah", 2, 7, 0);
  addObj("ups", 20, 2, 0); addObj("ups", 22, 2, 0);
  addObj("battery", 26, 2); addObj("battery", 27, 2); addObj("battery", 28, 2);
  for (let i = 20; i <= 23; i++) addObj("odf", i, 7);
  addObj("dockdoor", 3, 19, 0); addObj("shelf", 2, 12, 0); addObj("shelf", 5, 12, 0);
  addObj("counter", 10, 17, 0); addObj("gate", 12, 16);
  addObj("counter", 16, 18, 0); addObj("sofa", 18, 16, 0); addObj("plant", 20, 19);
  addObj("desk", 22, 18, 0);
  addObj("desk", 27, 18, 0); // NOC still missing screens + 2nd desk
}

// ---------------- three ----------------
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xa8d6f2); scene.fog = new THREE.Fog(0xbfe0f4, 80, 220);
scene.add(new THREE.HemisphereLight(0xe6f4ff, 0x6a8a4a, 0.7));
const sun = new THREE.DirectionalLight(0xfff0d8, 0.8); sun.position.set(-20, 40, 25); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 120 }); sun.shadow.bias = -0.0005; scene.add(sun);
const mc = {}; const M = (c, o = {}) => { const k = c + JSON.stringify(o); return mc[k] ||= new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, ...o }); };
function mesh(geo, c, parent, x = 0, y = 0, z = 0, o) { const m = new THREE.Mesh(geo, typeof c === "object" ? c : M(c, o)); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; }
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
// ground
