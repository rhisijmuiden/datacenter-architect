<title>Datacenter Architect Art Style</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen 3D stage with two views (characters / environment). HUD panels float on top in the game's brand. Deliberate single dark-panel look. */
:root {
  --panel: rgba(17, 29, 43, 0.88);
  --panel-solid: #142334;
  --panel-hi: #1d3247;
  --line: rgba(150, 190, 220, 0.18);
  --ink: #eaf2f8;
  --ink-dim: #93a9bc;
  --brand: #ffb23e;
  --cool: #55d2f2;
  --fiber: #ff7a2f;
  --ok: #5fd49b;
  --sky: #a8d6f2;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(5, 12, 20, 0.35); }
.label { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; color: var(--ink-dim); font-weight: 600; }

.top { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand h1 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.brand .sub { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
.tabs { display: flex; padding: 4px; gap: 4px; align-items: center; }
.tabs button { padding: 8px 14px; border-radius: 7px; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-dim); }
.tabs button:hover { color: var(--ink); background: var(--panel-hi); }
.tabs button.on { color: var(--ink); background: var(--panel-hi); box-shadow: inset 0 -3px 0 var(--brand); }
.right { margin-left: auto; display: flex; gap: 4px; padding: 4px; }
.right button { min-width: 40px; height: 36px; padding: 0 10px; border-radius: 7px; font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--ink-dim); display: grid; place-items: center; }
.right button:hover { color: var(--ink); background: var(--panel-hi); }
.right button.on { color: var(--brand); background: var(--panel-hi); }
.right svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.card { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100% - 24px)); padding: 16px; display: grid; gap: 10px; }
.card h2 { margin: 0; font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: 0.02em; display: flex; align-items: center; gap: 10px; }
.swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.card p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--ink-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 5px; background: var(--panel-hi); color: var(--ink); border: 1px solid var(--line); }
.nav { display: flex; gap: 6px; }
.nav button { flex: 1; padding: 8px; border-radius: 7px; background: var(--panel-hi); font-weight: 600; font-size: 13px; }
.nav button:hover { filter: brightness(1.2); }

.roster { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); padding: 6px; display: grid; gap: 2px; width: 210px; }
.roster button { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; font-size: 13.5px; text-align: left; color: var(--ink-dim); }
.roster button:hover { background: var(--panel-hi); color: var(--ink); }
.roster button.on { background: var(--panel-hi); color: var(--ink); box-shadow: inset 3px 0 0 var(--brand); }
.roster .swatch { width: 10px; height: 10px; border-radius: 50%; }

.notes { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: min(330px, calc(100% - 24px)); padding: 14px 16px; display: grid; gap: 8px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 13.5px; line-height: 1.4; color: var(--ink-dim); }
.notes b { color: var(--ink); font-weight: 600; }
.hint { position: fixed; left: 50%; transform: translateX(-50%); top: 76px; font-size: 12px; background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; border-radius: 20px; white-space: nowrap; transition: opacity .4s; pointer-events: none; }

@media (max-width: 900px) {
  .roster { width: auto; top: auto; bottom: max(12px, env(safe-area-inset-bottom, 0px)); transform: none; }
  .roster button span { display: none; }
  .card { width: min(300px, calc(100% - 90px)); }
  .hint { display: none; }
}
@media (max-width: 560px) {
  .brand .sub { display: none; }
  .notes { display: none; }
  .card p { font-size: 13px; }
}
</style>

</div>

const SKIN = [0xf1c7a3, 0xd9a27a, 0xb07650, 0x8a5636, 0x5e3a24, 0xf5d5b8];
const HAIR = { black: 0x2a2320, brown: 0x6b4428, blonde: 0xd8b065, red: 0xa8492a, grey: 0xb8b8b4 };

    look: { shirt: 0xf4f6f8, pants: 0x34404c, skin: 1, hair: "short", hairC: "brown", acc: ["headset", "laptop", "badge"] } },
  { id: "tech", color: 0xffd23a, swatch: "#ffd23a", name: { en: "Datacenter technician", nl: "Datacenter technicus" },

    chips: { en: ["Racks", "Cabling", "Hardware"], nl: ["Racks", "Bekabeling", "Hardware"] },
    look: { shirt: 0x5b6672, pants: 0x2c343c, vest: 0xffd23a, skin: 3, hair: "bun", hairC: "black", acc: ["toolbelt", "server", "badge"] } },
  { id: "elec", color: 0xffb23e, swatch: "#ffb23e", name: { en: "Electrical engineer", nl: "Elektrotechnisch engineer" },

    chips: { en: ["UPS", "Switchgear", "Generators"], nl: ["UPS", "Switchgear", "Generatoren"] },
    look: { shirt: 0xeef1f4, pants: 0x2f3a46, stripe: 0xffb23e, skin: 0, hair: "none", hat: "helmet", hatC: 0xffb23e, acc: ["multimeter", "badge"] } },
  { id: "cool", color: 0x55d2f2, swatch: "#55d2f2", name: { en: "Cooling technician", nl: "Koeltechnicus" },
    desc: { en: "Services chillers and CRAH units. Cyan overalls, the colour of cooling.", nl: "Onderhoudt koelmachines en CRAH-units. Cyaan overall, de kleur van koeling." },
    chips: { en: ["Chillers", "CRAH", "Free cooling"], nl: ["Koelmachines", "CRAH", "Vrije koeling"] },
    look: { shirt: 0x55d2f2, pants: 0x3aa6c4, skin: 2, hair: "short", hairC: "black", hat: "beanie", hatC: 0x1e4f66, acc: ["wrench", "badge"] } },
  { id: "net", color: 0xff7a2f, swatch: "#ff7a2f", name: { en: "Network engineer", nl: "Netwerkengineer" },
    desc: { en: "Works on switches, routers, carriers and the meet-me room. Orange accents, the colour of fiber.", nl: "Werkt aan switches, routers, carriers en de meet-me room. Oranje accenten, de kleur van glasvezel." },
    chips: { en: ["MMR", "Switches", "Peering"], nl: ["MMR", "Switches", "Peering"] },
    look: { shirt: 0x2c3a48, pants: 0x3c4652, stripe: 0xff7a2f, skin: 4, hair: "curly", hairC: "black", acc: ["spool", "badge"] } },
  { id: "noc", color: 0x5a6672, swatch: "#5a6672", name: { en: "NOC operator", nl: "NOC-operator" },
    desc: { en: "Watches every alarm on site from the NOC and sends the right person. Rarely leaves the screens.", nl: "Bewaakt elk alarm op het terrein vanuit het NOC en stuurt de juiste persoon. Komt zelden weg bij de schermen." },
    chips: { en: ["Alarms", "24/7 shifts"], nl: ["Alarmen", "24/7-diensten"] },
    look: { shirt: 0x4a5560, pants: 0x262d34, skin: 5, hair: "ponytail", hairC: "red", acc: ["headset", "mug", "badge"] } },
  { id: "guard", color: 0x23395c, swatch: "#23395c", name: { en: "Security guard", nl: "Beveiliger" },
    desc: { en: "Checks in every visitor and delivery at the gatehouse and patrols the fence.", nl: "Checkt elke bezoeker en levering in bij de loge en loopt patrouilles langs het hek." },
    chips: { en: ["Check-in", "Patrols", "Access control"], nl: ["Check-in", "Patrouilles", "Toegangscontrole"] },
    look: { shirt: 0x23395c, pants: 0x1a2638, skin: 2, hair: "short", hairC: "black", hat: "cap", hatC: 0x1a2638, acc: ["radio", "epaulettes"] } },
  { id: "logi", color: 0xe8732c, swatch: "#e8732c", name: { en: "Logistics", nl: "Logistiek medewerker" },
    desc: { en: "Receives deliveries at the loading dock and moves boxes on a hand truck to storage.", nl: "Ontvangt leveringen bij het laadperron en rijdt dozen met een steekwagen naar de opslag." },
    chips: { en: ["Loading dock", "Storage"], nl: ["Laadperron", "Opslag"] },
    look: { shirt: 0xe8732c, pants: 0x34404c, skin: 1, hair: "short", hairC: "blonde", hat: "cap", hatC: 0x34404c, acc: ["trolley"] } },
  { id: "mgr", color: 0x3e4a73, swatch: "#3e4a73", name: { en: "Manager", nl: "Manager" },
    desc: { en: "Boosts the efficiency of the team around them. Suit, tablet and always in a hurry.", nl: "Verhoogt de efficiëntie van het team om hen heen. Pak, tablet en altijd haast." },
    chips: { en: ["Team bonus"], nl: ["Teambonus"] },
    look: { shirt: 0x3e4a73, pants: 0x2a3150, tie: 0xffb23e, skin: 3, hair: "side", hairC: "grey", acc: ["tablet", "badge"] } },
  { id: "visitor", visitor: true, color: 0x7c9a5e, swatch: "#7c9a5e", name: { en: "Customer visitor", nl: "Klant op bezoek" },
    desc: { en: "Customers come to install their own servers. They need an escort, a badge and the customer room.", nl: "Klanten komen hun eigen servers plaatsen. Ze hebben begeleiding, een badge en de klantenruimte nodig." },
    chips: { en: ["Escort", "Visitor badge"], nl: ["Begeleiding", "Bezoekersbadge"] },
    look: { shirt: 0x7c9a5e, pants: 0x4a5a78, skin: 0, hair: "long", hairC: "brown", acc: ["backpack", "visitorbadge"] } }
];

// ---------------- three setup ----------------
const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const mcache = {};
const M = (c, o = {}) => { const k = c + JSON.stringify(o); return mcache[k] ||= new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, metalness: 0.02, ...o }); };
const sh = m => { m.castShadow = true; m.receiveShadow = true; return m; };
function mesh(geo, c, parent, x = 0, y = 0, z = 0, o) { const m = sh(new THREE.Mesh(geo, typeof c === "object" ? c : M(c, o))); m.position.set(x, y, z); parent.add(m); return m; }
const rbox = (w, h, d) => new THREE.BoxGeometry(w, h, d);

// ---------------- character builder ----------------
function buildChar(def) {
  const L = def.look, root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const skin = SKIN[L.skin];
  // legs
  const legs = [];
  for (const s of [-1, 1]) {
    const hip = new THREE.Group(); hip.position.set(0.13 * s, 0.62, 0); body.add(hip);
    mesh(new THREE.CapsuleGeometry(0.12, 0.32, 4, 10), L.pants, hip, 0, -0.27, 0);
    mesh(rbox(0.2, 0.12, 0.3), 0x2a2a2e, hip, 0, -0.56, 0.04);
    legs.push(hip);
  }
  // torso
  const torso = mesh(new THREE.CapsuleGeometry(0.31, 0.34, 6, 16), L.shirt, body, 0, 1.0, 0); torso.scale.set(1.05, 1, 0.82);
  if (L.vest) { const v = mesh(new THREE.CylinderGeometry(0.335, 0.33, 0.48, 16), L.vest, body, 0, 0.98, 0); v.scale.z = 0.84;
    for (const y of [0.88, 1.06]) { const st = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.045, 16), 0xe8eef2, body, 0, y, 0, { emissive: 0x666666, emissiveIntensity: 0.3 }); st.scale.z = 0.85; } }
  if (L.stripe) { const st = mesh(new THREE.CylinderGeometry(0.335, 0.335, 0.08, 16), L.stripe, body, 0, 1.12, 0); st.scale.z = 0.85; }
  if (L.tie) { mesh(rbox(0.07, 0.3, 0.02), L.tie, body, 0, 1.08, 0.27); mesh(rbox(0.22, 0.14, 0.02), 0xf4f6f8, body, 0, 1.24, 0.25); }
  // arms
  const arms = [];
  for (const s of [-1, 1]) {
    const sho = new THREE.Group(); sho.position.set(0.38 * s, 1.24, 0); body.add(sho);
    mesh(new THREE.CapsuleGeometry(0.085, 0.36, 4, 8), L.shirt, sho, 0.03 * s, -0.24, 0);
    mesh(new THREE.SphereGeometry(0.09, 10, 8), skin, sho, 0.04 * s, -0.5, 0);
    sho.rotation.z = 0.1 * s;
    arms.push(sho);
  }
  if (L.acc.includes("epaulettes")) for (const s of [-1, 1]) mesh(rbox(0.16, 0.04, 0.2), 0xd8b065, body, 0.3 * s, 1.36, 0);
  // head
  const head = new THREE.Group(); head.position.set(0, 1.66, 0); body.add(head);
  mesh(new THREE.SphereGeometry(0.31, 20, 16), skin, head);
  mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.12, 10), skin, body, 0, 1.38, 0);
  for (const s of [-1, 1]) { mesh(new THREE.SphereGeometry(0.038, 8, 8), 0x1b1b1f, head, 0.11 * s, 0.03, 0.28); mesh(new THREE.SphereGeometry(0.05, 8, 8), skin, head, 0.3 * s, 0, 0); }
  mesh(new THREE.TorusGeometry(0.06, 0.012, 6, 12, Math.PI), 0x8a4a3a, head, 0, -0.08, 0.28).rotation.z = Math.PI;
  const hc = HAIR[L.hairC] ?? 0x2a2320;
  const cap = (r = 0.325, t = 0.5) => new THREE.SphereGeometry(r, 20, 12, 0, Math.PI * 2, 0, Math.PI * t);
  if (L.hair === "short") { const h = mesh(cap(), hc, head); h.rotation.x = -0.25; }
  if (L.hair === "side") { const h = mesh(cap(0.33, 0.48), hc, head); h.rotation.set(-0.3, 0, 0.15); }
  if (L.hair === "bun") { const h = mesh(cap(), hc, head); h.rotation.x = -0.3; mesh(new THREE.SphereGeometry(0.13, 12, 10), hc, head, 0, 0.26, -0.2); }
  if (L.hair === "ponytail") { const h = mesh(cap(), hc, head); h.rotation.x = -0.3; mesh(new THREE.CapsuleGeometry(0.08, 0.3, 4, 8), hc, head, 0, -0.08, -0.33).rotation.x = 0.4; }
  if (L.hair === "long") { const h = mesh(cap(0.335, 0.62), hc, head); h.rotation.x = -0.45; mesh(rbox(0.5, 0.42, 0.14), hc, head, 0, -0.18, -0.22); }
  if (L.hair === "curly") { for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2, r = 0.25; mesh(new THREE.SphereGeometry(0.11, 8, 6), hc, head, Math.cos(a) * r, 0.17 + (i % 2) * 0.05, Math.sin(a) * r - 0.04); } mesh(cap(0.3), hc, head, 0, 0.06, -0.02); }
  if (L.hat === "cap") { mesh(new THREE.CylinderGeometry(0.31, 0.33, 0.18, 18), L.hatC, head, 0, 0.24, 0); mesh(rbox(0.36, 0.035, 0.22), L.hatC, head, 0, 0.17, 0.33); mesh(rbox(0.12, 0.08, 0.02), 0xd8b065, head, 0, 0.26, 0.31); }
  if (L.hat === "helmet") { mesh(cap(0.35, 0.5), L.hatC, head, 0, 0.05, 0); const b = mesh(new THREE.TorusGeometry(0.35, 0.03, 6, 24), L.hatC, head, 0, 0.06, 0); b.rotation.x = Math.PI / 2; mesh(rbox(0.06, 0.06, 0.66), 0xe39a2a, head, 0, 0.38, 0); }

  for (let k = 0; k < 4; k++) mesh(new THREE.IcosahedronGeometry(rnd(0.9, 1.3) * s, 1), [0x5c9a45, 0x4f8d3d, 0x6aa84f][k % 3], parent, x + rnd(-0.6, 0.6) * s, (2.6 + rnd(0, 0.9)) * s, z + rnd(-0.6, 0.6) * s, { flatShading: true }); }
function blossom(x, z) { mesh(new THREE.CylinderGeometry(0.16, 0.24, 1.8, 6), 0x6b4a2e, sceneB, x, 0.9, z); for (let k = 0; k < 4; k++) mesh(new THREE.IcosahedronGeometry(rnd(0.8, 1.1), 1), [0xe7a6c8, 0xd98fb9][k % 2], sceneB, x + rnd(-0.6, 0.6), 2.4 + rnd(0, 0.8), z + rnd(-0.6, 0.6), { flatShading: true }); }
function bush(x, z, c = 0x4a8c41) { const b = mesh(new THREE.IcosahedronGeometry(rnd(0.5, 0.75), 1), c, sceneB, x, 0.4, z, { flatShading: true }); b.scale.y = 0.75; }
for (let i = 0; i < 7; i++) bush(-9 + i * 1.2, 3.2);
for (let i = 0; i < 6; i++) bush(5 + i * 1.2, 3.2);
for (let i = 0; i < 10; i++) bush(-34 + i * 2.2, 15.3, 0x3f7f3a);
roundTree(-11, 10); roundTree(8, 10); blossom(-11.5, 1); blossom(8, 1.2); roundTree(27, 12); roundTree(30, 4);
for (let i = 0; i < 14; i++) { const fx = rnd(-9, -4), fz = rnd(2.6, 3.8); mesh(new THREE.SphereGeometry(0.1, 6, 6), [0xffd23a, 0xff8a8a, 0xffffff][i % 3], sceneB, fx, 0.55, fz); }
for (let i = 0; i < 90; i++) { const x = rnd(-120, 120), z = rnd(-110, -32); (Math.random() < 0.65 ? pine : roundTree)(x, z, rnd(0.9, 1.6)); }
for (let i = 0; i < 30; i++) { const x = rnd(-120, 120), z = rnd(30, 90); (Math.random() < 0.5 ? pine : roundTree)(x, z, rnd(0.9, 1.5)); }
for (let i = 0; i < 14; i++) { const x = (Math.random() < 0.5 ? -1 : 1) * rnd(38, 90), z = rnd(-30, 16); pine(x, z, rnd(1, 1.5)); }
// skyline + hills
for (let i = 0; i < 30; i++) { const h = rnd(25, 85); mesh(rbox(rnd(8, 16), h, rnd(8, 16)), 0x9db5c6, sceneB, -180 + i * 12 + rnd(-3, 3), h / 2, -200 + rnd(-20, 10)); }
for (let i = 0; i < 8; i++) { const hl = mesh(new THREE.SphereGeometry(rnd(40, 70), 16, 10), 0x7fa86a, sceneB, -260 + i * 75, -8, -250); hl.scale.y = 0.4; hl.castShadow = false; }
// lamp posts, benches, bins, bike rack
const lampLights = [], lampHeads = [];
function lamp(x, z) {
  mesh(new THREE.CylinderGeometry(0.07, 0.09, 4, 8), 0x37414b, sceneB, x, 2, z);
  mesh(rbox(0.9, 0.08, 0.12), 0x37414b, sceneB, x + 0.4, 4, z);
  const head = mesh(rbox(0.5, 0.14, 0.3), 0xf8f3e4, sceneB, x + 0.75, 3.92, z, { emissive: 0xffd9a0, emissiveIntensity: 0 }); lampHeads.push(head);
  const L = new THREE.PointLight(0xffd29a, 0, 12, 2); L.position.set(x + 0.75, 3.7, z); sceneB.add(L); lampLights.push(L);
}
lamp(-10, 8); lamp(6, 8); lamp(-5, 15); lamp(10, 15); lamp(-27, 15); lamp(-15, 15); lamp(22, 15);
function bench(x, z, rot) { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rot; sceneB.add(g);
  mesh(rbox(2, 0.1, 0.55), 0xb07a45, g, 0, 0.5, 0); mesh(rbox(2, 0.5, 0.08), 0xb07a45, g, 0, 0.85, -0.26);
  for (const s of [-0.85, 0.85]) mesh(rbox(0.08, 0.5, 0.5), 0x37414b, g, s, 0.25, 0); }
bench(-8, 8.5, Math.PI / 2); bench(4, 8.5, -Math.PI / 2);
mesh(new THREE.CylinderGeometry(0.28, 0.25, 0.8, 10), 0x37414b, sceneB, -8, 0.4, 11);
for (let i = 0; i < 5; i++) { const r = mesh(new THREE.TorusGeometry(0.4, 0.04, 6, 14, Math.PI), 0x9aa4ad, sceneB, 3 + i * 0.7, 0, 13); r.rotation.y = Math.PI / 2; }
// status beacon on roof
const beacon = mesh(new THREE.SphereGeometry(0.3, 12, 12), 0x5fd49b, sceneB, 25, 9.6, -2, { emissive: 0x5fd49b, emissiveIntensity: 1 });

// people walking in scene B
const walkers = [];
function walker(id, path, speed) {
  const def = CHARS.find(c => c.id === id); const c = buildChar(def); sceneB.add(c);
  walkers.push({ c, path: path.map(p => new THREE.Vector3(p[0], 0.04, p[1])), seg: 0, u: Math.random(), speed });
}
walker("guard", [[-32, 15], [32, 15], [32, -28], [-32, -28]], 1.3);
walker("guard", [[-10, 19.5], [-7, 19.5]], 0.5);
walker("visitor", [[-18, 13.5], [-6, 14.5], [-2, 13], [-2, 3]], 1.0);
walker("support", [[-2, 3.5], [-2, 12], [6, 12], [6, 4]], 1.1);
walker("logi", [[13, 4], [21, 4], [21, 7], [13, 7]], 0.9);
walker("tech", [[10, 5], [26, 6.5], [26, 12], [10, 12]], 1.0);
walker("elec", [[-20, -5], [-20, -18], [-28, -18], [-28, -5]], 0.9);
walker("cool", [[-10, -1.5], [24, -1.5]], 1.0);
walker("net", [[-14, 3.5], [-6, 4.5]], 0.9);
walker("mgr", [[0, 6], [-6, 9.5], [-12, 6], [-6, 4]], 1.4);

// =====================================================================
// camera rigs
// =====================================================================
const camera = new THREE.PerspectiveCamera(36, 1, 0.3, 900);
const rigs = {
  A: { target: new THREE.Vector3(2.6, 1.1, 0), az: 0.12, el: 0.16, dist: 24, minD: 4, maxD: 34, minEl: 0.02, maxEl: 1.1 },
  B: { target: new THREE.Vector3(-2, 0, 2), az: -0.5, el: 0.55, dist: 62, minD: 14, maxD: 140, minEl: 0.15, maxEl: 1.35 }
};
for (const r of Object.values(rigs)) { r.azG = r.az; r.elG = r.el; r.dG = r.dist; r.tG = r.target.clone(); }
let view = "A";
const rig = () => rigs[view];
function placeCam(r) { camera.position.set(r.target.x + r.dist * Math.cos(r.el) * Math.sin(r.az), r.target.y + r.dist * Math.sin(r.el), r.target.z + r.dist * Math.cos(r.el) * Math.cos(r.az)); camera.lookAt(r.target); }

const ptrs = new Map(); let mode = null, last = null, moved = 0, pinch = 0, autoSpin = true;
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); mode = (e.button === 2 || e.shiftKey) ? "pan" : "rot"; last = { x: e.clientX, y: e.clientY }; moved = 0; autoSpin = false; canvas.classList.add("dragging"); hideHint();
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); mode = "pinch"; } });
canvas.addEventListener("pointermove", e => { if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); const r = rig();
  if (mode === "pinch" && ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); r.dG = THREE.MathUtils.clamp(r.dG * pinch / d, r.minD, r.maxD); pinch = d; moved += 10; return; }
  const dx = e.clientX - last.x, dy = e.clientY - last.y; last = { x: e.clientX, y: e.clientY }; moved += Math.abs(dx) + Math.abs(dy);
  if (mode === "rot") { r.azG -= dx * 0.006; r.elG = THREE.MathUtils.clamp(r.elG + dy * 0.004, r.minEl, r.maxEl); }
  else if (mode === "pan") { const s = r.dist * 0.0016; r.tG.x += (-dx * Math.cos(r.az) - dy * Math.sin(r.az)) * s; r.tG.z += (dx * Math.sin(r.az) - dy * Math.cos(r.az)) * s; } });
function endP(e) { ptrs.delete(e.pointerId); canvas.classList.remove("dragging"); if (moved < 5 && e.type === "pointerup") pick(e); if (!ptrs.size) mode = null; }
canvas.addEventListener("pointerup", endP); canvas.addEventListener("pointercancel", endP);
canvas.addEventListener("wheel", e => { e.preventDefault(); autoSpin = false; const r = rig(); r.dG = THREE.MathUtils.clamp(r.dG * (1 + Math.sign(e.deltaY) * 0.1), r.minD, r.maxD); hideHint(); }, { passive: false });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e) {
  const rc = canvas.getBoundingClientRect(); ndc.set(((e.clientX - rc.left) / rc.width) * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(view === "A" ? sceneA.children : sceneB.children, true);
  for (const h of hits) { const c = h.object.userData.char; if (c) { select(CHARS.indexOf(c.userData.def), view === "B" ? c : null); return; } }
}

// ---------------- UI ----------------
const roster = document.getElementById("roster");
CHARS.forEach((d, i) => { const b = document.createElement("button"); b.innerHTML = `<span class="swatch" style="background:${d.swatch}"></span><span></span>`; b.onclick = () => select(i); roster.appendChild(b); });
let sel = 0, follow = null;
function select(i, followChar = null) {
  sel = (i + CHARS.length) % CHARS.length; const d = CHARS[sel];
  [...roster.children].forEach((b, k) => b.classList.toggle("on", k === sel));
  document.getElementById("cRole").textContent = d.visitor ? T[lang].visitor : T[lang].role;
  document.getElementById("cName").textContent = d.name[lang];
  document.getElementById("cSw").style.background = d.swatch;
  document.getElementById("cDesc").textContent = d.desc[lang];
  document.getElementById("cChips").innerHTML = d.chips[lang].map(c => `<span class="chip">${c}</span>`).join("");
  if (view === "A") { const c = chars[sel]; rigs.A.tG.set(c.position.x, 1.0, 0); rigs.A.dG = Math.min(rigs.A.dG, 7.5); autoSpin = false; chars.forEach((ch, k) => ch.userData.ring.scale.setScalar(k === sel ? 1.12 : 1)); }
  else { follow = followChar || walkers.find(w => w.c.userData.def === d)?.c || null; document.getElementById("card").hidden = !followChar; if (followChar) document.getElementById("envNotes").hidden = true; }
}
document.getElementById("prev").onclick = () => select(sel - 1);
document.getElementById("next").onclick = () => select(sel + 1);
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = T[lang][el.dataset.i]);
  document.getElementById("envList").innerHTML = T[lang].env.map(x => `<li>${x}</li>`).join("");
  [...roster.children].forEach((b, k) => b.lastChild.textContent = CHARS[k].name[lang]);
  document.getElementById("lang").textContent = lang === "en" ? "NL" : "EN";
  select(sel, follow);
}
document.getElementById("lang").onclick = () => { lang = lang === "en" ? "nl" : "en"; applyLang(); };
function setView(v) {
  view = v; follow = null;
  document.getElementById("tabChars").classList.toggle("on", v === "A");
  document.getElementById("tabEnv").classList.toggle("on", v === "B");
  document.getElementById("envNotes").hidden = v !== "B";
  document.getElementById("night").hidden = v !== "B";
  document.getElementById("roster").hidden = v === "B";
  document.getElementById("card").hidden = v === "B";
}
document.getElementById("tabChars").onclick = () => setView("A");
document.getElementById("tabEnv").onclick = () => setView("B");
let walking = true;
document.getElementById("walk").onclick = e => { walking = !walking; e.currentTarget.classList.toggle("on", walking); };
let night = false;
document.getElementById("night").onclick = e => { night = !night; e.currentTarget.classList.toggle("on", night); };
const hint = document.getElementById("hint"); let hintGone = false;
function hideHint() { if (!hintGone) { hintGone = true; hint.style.opacity = "0"; } }
window.addEventListener("keydown", e => { if (e.key === "ArrowRight") select(sel + 1); if (e.key === "ArrowLeft") select(sel - 1); });

// ---------------- loop ----------------
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < 600 ? 50 : 36; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let prev = performance.now(), nightMix = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now; const t = now / 1000;
  const r = rig();
  if (autoSpin && !reduce && view === "B") r.azG -= dt * 0.04;
  if (view === "B" && follow) { r.tG.lerp(follow.position, Math.min(1, dt * 3)); r.dG += (22 - r.dG) * Math.min(1, dt * 1.5); }
  r.az += (r.azG - r.az) * Math.min(1, dt * 6); r.el += (r.elG - r.el) * Math.min(1, dt * 6); r.dist += (r.dG - r.dist) * Math.min(1, dt * 4); r.target.lerp(r.tG, Math.min(1, dt * 6));
  placeCam(r);
  if (view === "A") {
    chars.forEach((c, k) => { animChar(c, t, walking && !reduce); if (!reduce) c.rotation.y = k === sel ? Math.sin(t * 0.6) * 0.9 : Math.sin(t * 0.3 + k) * 0.3; });
    renderer.render(sceneA, camera);
  } else {
    const goal = night ? 1 : 0; nightMix += (goal - nightMix) * Math.min(1, dt * 2);
    sceneB.background.copy(skyDay).lerp(skyNight, nightMix); sceneB.fog.color.copy(sceneB.background);
    sunB.intensity = 0.95 * (1 - nightMix) + 0.12 * nightMix; sunB.color.setHSL(0.1, 0.6 + 0.2 * nightMix, 0.9 - 0.2 * nightMix);
    hemiB.intensity = 0.62 * (1 - nightMix) + 0.22 * nightMix;
    lampLights.forEach(l => l.intensity = 1.6 * nightMix); lampHeads.forEach(h => h.material.emissiveIntensity = 1.2 * nightMix);
    winMat.emissiveIntensity = 0.9 * nightMix;
    if (!reduce) {
      beacon.material.emissiveIntensity = 0.6 + Math.sin(t * 3) * 0.5;
      arm.rotation.z = Math.max(0, Math.sin(t * 0.4)) * 1.35;
      walkers.forEach(w => {
        if (walking) { const a = w.path[w.seg], b = w.path[(w.seg + 1) % w.path.length]; const len = a.distanceTo(b) || 1; w.u += w.speed * dt / len;
          if (w.u >= 1) { w.u = 0; w.seg = (w.seg + 1) % w.path.length; }
          w.c.position.lerpVectors(a, b, w.u); w.c.rotation.y = Math.atan2(b.x - a.x, b.z - a.z); }
        animChar(w.c, t, walking, w.speed);
      });
    }
    renderer.render(sceneB, camera);
  }
  requestAnimationFrame(frame);
}
setView("A"); applyLang(); select(0);
rigs.A.tG.set(2.6, 1.1, 0); rigs.A.dG = 24; chars[0].userData.ring.scale.setScalar(1.12);
requestAnimationFrame(frame);
})();
</script>
