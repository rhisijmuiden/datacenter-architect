<title>Datacenter Architect Art Style</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen 3D stage with two views (characters / environment). HUD panels float on top in the game's brand. Deliberate single dark-panel look. */
:root {
  --panel: rgba(17, 29, 43, 0.88);
  --panel-solid: #142334;
  --panel-hi: #1d3247;
  --line: rgba(150, 190, 220, 0.18);
  --ink: #eaf2f8;
  --ink-dim: #93a9bc;
  --brand: #ffb23e;
  --cool: #55d2f2;
  --fiber: #ff7a2f;
  --ok: #5fd49b;
  --sky: #a8d6f2;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(5, 12, 20, 0.35); }
.label { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; color: var(--ink-dim); font-weight: 600; }

.top { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand h1 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.brand .sub { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
.tabs { display: flex; padding: 4px; gap: 4px; align-items: center; }
.tabs button { padding: 8px 14px; border-radius: 7px; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-dim); }
.tabs button:hover { color: var(--ink); background: var(--panel-hi); }
.tabs button.on { color: var(--ink); background: var(--panel-hi); box-shadow: inset 0 -3px 0 var(--brand); }
.right { margin-left: auto; display: flex; gap: 4px; padding: 4px; }
.right button { min-width: 40px; height: 36px; padding: 0 10px; border-radius: 7px; font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--ink-dim); display: grid; place-items: center; }
.right button:hover { color: var(--ink); background: var(--panel-hi); }
.right button.on { color: var(--brand); background: var(--panel-hi); }
.right svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.card { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100% - 24px)); padding: 16px; display: grid; gap: 10px; }
.card h2 { margin: 0; font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: 0.02em; display: flex; align-items: center; gap: 10px; }
.swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.card p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--ink-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 8px; border-radius: 5px; background: var(--panel-hi); color: var(--ink); border: 1px solid var(--line); }
.nav { display: flex; gap: 6px; }
.nav button { flex: 1; padding: 8px; border-radius: 7px; background: var(--panel-hi); font-weight: 600; font-size: 13px; }
.nav button:hover { filter: brightness(1.2); }

.roster { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); padding: 6px; display: grid; gap: 2px; width: 210px; }
.roster button { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; font-size: 13.5px; text-align: left; color: var(--ink-dim); }
.roster button:hover { background: var(--panel-hi); color: var(--ink); }
.roster button.on { background: var(--panel-hi); color: var(--ink); box-shadow: inset 3px 0 0 var(--brand); }
.roster .swatch { width: 10px; height: 10px; border-radius: 50%; }

.notes { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: min(330px, calc(100% - 24px)); padding: 14px 16px; display: grid; gap: 8px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 13.5px; line-height: 1.4; color: var(--ink-dim); }
.notes b { color: var(--ink); font-weight: 600; }
.wx { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: 84px; width: min(340px, calc(100% - 24px)); padding: 14px; display: grid; gap: 10px; }
.wx .row { display: flex; flex-wrap: wrap; gap: 4px; }
.wx .row button { padding: 6px 9px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); background: rgba(255,255,255,0.04); border: 1px solid var(--line); }
.wx .row button:hover { color: var(--ink); }
.wx .row button.on { color: #1b1408; background: var(--brand); border-color: var(--brand); }
.wx .temp { display: flex; align-items: baseline; gap: 10px; }
.wx .temp b { font-family: var(--display); font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.wx .temp span { color: var(--ink-dim); font-size: 13px; }
.wx ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; line-height: 1.35; }
.wx li { display: flex; gap: 8px; align-items: flex-start; }
.wx .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; }
.wx .auto { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wx .auto button { padding: 6px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); color: var(--ink-dim); }
.wx .auto button.on { color: var(--brand); border-color: var(--brand); }
.mcard { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: min(360px, calc(100% - 24px)); padding: 16px; display: grid; gap: 10px; }
.mcard h2 { margin: 0; font-family: var(--display); font-size: 24px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--ink-dim); }
.kv span:nth-child(even) { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.btn { background: var(--brand); color: #1b1408; font-weight: 600; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--panel-hi); color: var(--ink); }
.msites { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: 84px; width: 230px; padding: 12px; display: grid; gap: 8px; }
.msites .list { display: grid; gap: 2px; }
.msites .list button { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; font-size: 13.5px; color: var(--ink-dim); text-align: left; }
.msites .list button:hover, .msites .list button.on { background: var(--panel-hi); color: var(--ink); }
.msites .list small { margin-left: auto; color: var(--ink-dim); font-size: 12px; }
.layer { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); cursor: pointer; }
.layer input { accent-color: var(--brand); width: 15px; height: 15px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; padding: 10px 16px; font-size: 14px; border-radius: 10px; background: var(--panel-solid); border: 1px solid var(--brand); }
.floors { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: 84px; width: 250px; padding: 12px; display: grid; gap: 8px; }
.floors .fl { display: grid; gap: 3px; }
.floors .fl button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; text-align: left; font-size: 13.5px; color: var(--ink-dim); border: 1px solid transparent; }
.floors .fl button b { font-family: var(--display); font-size: 16px; width: 26px; color: var(--ink); }
.floors .fl button:hover { background: var(--panel-hi); color: var(--ink); }
.floors .fl button.on { background: var(--panel-hi); color: var(--ink); border-color: var(--brand); }
.fnotes { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100% - 24px)); padding: 14px 16px; display: grid; gap: 8px; }
.fnotes h2 { margin: 0; font-family: var(--display); font-size: 22px; }
.fnotes ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 13.5px; line-height: 1.4; color: var(--ink-dim); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-dim); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.hint { position: fixed; left: 50%; transform: translateX(-50%); top: 76px; font-size: 12px; background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; border-radius: 20px; white-space: nowrap; transition: opacity .4s; pointer-events: none; }

@media (max-width: 900px) {
  .roster { width: auto; top: auto; bottom: max(12px, env(safe-area-inset-bottom, 0px)); transform: none; }
  .roster button span { display: none; }
  .card { width: min(300px, calc(100% - 90px)); }
  .hint { display: none; }
}
@media (max-width: 560px) {
  .floors { top: auto; bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 150px; }
  .floors .fl button span { display: none; }
  .fnotes { width: calc(100% - 186px); }
  .fnotes ul { display: none; }
  .msites { top: auto; bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 170px; }
  .mcard { width: calc(100% - 206px); }
  .wx { top: auto; bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding: 10px; gap: 8px; }
  .wx .temp b { font-size: 30px; }
  .brand .sub { display: none; }
  .notes { display: none; }
  .card p { font-size: 13px; }
}
</style>

function tex(w, h, draw, rep = [1, 1]) {

}

const paving = rep => tex(256, 256, (g, w, h) => {
  g.fillStyle = "#b9b2a6"; g.fillRect(0, 0, w, h);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 4; x++) {
    const off = (y % 2) * 32; const l = 72 + rnd(-6, 6);
    g.fillStyle = `hsl(36, 8%, ${l}%)`; g.fillRect(x * 64 + off + 2, y * 32 + 2, 60, 28);
    g.fillStyle = `hsl(36, 8%, ${l - 4}%)`; g.fillRect(x * 64 + off - 64 + 2, y * 32 + 2, 60, 28);
  }
}, rep);

}, rep);

}
document.getElementById("tabChars").onclick = () => setView("A");

const hint = document.getElementById("hint"); let hintGone = false;

window.addEventListener("keydown", e => { if (e.key === "ArrowRight") select(sel + 1); if (e.key === "ArrowLeft") select(sel - 1); });

// ---------------- loop ----------------
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < 600 ? 50 : 36; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let prev = performance.now(), nightMix = 0;
function frame(now) {

  const r = rig();
  if (autoSpin && !reduce && view === "B") r.azG -= dt * 0.04;
  if (view === "B" && follow) { r.tG.lerp(follow.position, Math.min(1, dt * 3)); r.dG += (22 - r.dG) * Math.min(1, dt * 1.5); }
  r.az += (r.azG - r.az) * Math.min(1, dt * 6); r.el += (r.elG - r.el) * Math.min(1, dt * 6); r.dist += (r.dG - r.dist) * Math.min(1, dt * 4); r.target.lerp(r.tG, Math.min(1, dt * 6));
  placeCam(r);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.hidden = true; }
  if (view === "D") { tickBuilding(dt, t); if (autoSpin && !reduce) r.azG -= dt * 0.05; renderer.render(sceneD, camera); }
  else if (view === "C") {
    if (!reduce) blades.forEach(b => b.rotation.z += dt * 1.6);
    mapItems.forEach(i => { if (i.head) i.head.position.y = 7.5 + (i === mSel ? Math.sin(t * 3) * 0.4 : 0); });
    renderer.render(sceneC, camera);
  } else if (view === "A") {
    chars.forEach((c, k) => { animChar(c, t, walking && !reduce); if (!reduce) c.rotation.y = k === sel ? Math.sin(t * 0.6) * 0.9 : Math.sin(t * 0.3 + k) * 0.3; });
    renderer.render(sceneA, camera);
  } else {
    const goal = night ? 1 : 0; nightMix += (goal - nightMix) * Math.min(1, dt * 2);
    tickWeather(dt, t);
    skyDay.lerp(new THREE.Color(SKY[weather]), Math.min(1, dt * 2));
    sceneB.background.copy(skyDay).lerp(skyNight, nightMix * (weather === "storm" ? 0.7 : 1));
    if (flash > 0) sceneB.background.lerp(new THREE.Color(0xeef4ff), flash * 0.8);

    hemiB.intensity = (0.62 * (0.6 + 0.4 * sk)) * (1 - nightMix) + 0.22 * nightMix + flash * 1.4;

        if (walking) { const a = w.path[w.seg], b = w.path[(w.seg + 1) % w.path.length]; const len = a.distanceTo(b) || 1; w.u += w.speed * dt / len;
          if (w.u >= 1) { w.u = 0; w.seg = (w.seg + 1) % w.path.length; }
          w.c.position.lerpVectors(a, b, w.u); w.c.rotation.y = Math.atan2(b.x - a.x, b.z - a.z); }
