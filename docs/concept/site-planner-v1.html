<title>Datacenter Architect Site Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen 3D site. Tools left (house rule), visit route + site checks right, stats top, hint bottom. Same dark-panel game look as the room designer. */
/* Layout: full-screen 3D build grid. Tools on the left (house rule), room checklist on the right, stats on top, tool hint at the bottom. Single dark-panel game look. */
:root {
  --panel: rgba(17, 29, 43, 0.9);
  --panel-solid: #142334;
  --panel-hi: #1d3247;
  --line: rgba(150, 190, 220, 0.18);
  --ink: #eaf2f8;
  --ink-dim: #93a9bc;
  --brand: #ffb23e;
  --cool: #55d2f2;
  --fiber: #ff7a2f;
  --ok: #5fd49b;
  --bad: #ff6b5e;
  --sky: #a8d6f2;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(5, 12, 20, 0.35); }
.label { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; color: var(--ink-dim); font-weight: 600; }

.top { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand h1 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1; }
.brand .sub { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
.stats { display: flex; flex-wrap: wrap; }
.stat { padding: 8px 14px; border-right: 1px solid var(--line); display: grid; gap: 3px; min-width: 110px; }
.stat:last-child { border-right: 0; }
.stat .v { font-family: var(--display); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.stat .v small { font-size: 12px; color: var(--ink-dim); font-weight: 500; }
.bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.right-tools { margin-left: auto; display: flex; gap: 4px; padding: 4px; align-items: center; }
.right-tools button { min-width: 38px; height: 36px; padding: 0 10px; border-radius: 7px; font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--ink-dim); display: grid; place-items: center; }
.right-tools button:hover { color: var(--ink); background: var(--panel-hi); }
.right-tools button.on { color: var(--brand); background: var(--panel-hi); }
.right-tools svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.tools { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: 84px; bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 220px; padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tgrid button { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 7px; font-size: 13.5px; font-weight: 500; color: var(--ink-dim); text-align: left; }
.tgrid button svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tgrid button:hover { background: var(--panel-hi); color: var(--ink); }
.tgrid button.on { background: var(--panel-hi); color: var(--ink); box-shadow: inset 3px 0 0 var(--brand); }
.sep { height: 1px; background: var(--line); margin: 2px 4px; flex: none; }
.palette { overflow-y: auto; display: grid; gap: 2px; padding-right: 2px; min-height: 0; }
.palette button { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 7px; font-size: 13.5px; color: var(--ink-dim); text-align: left; }
.palette button:hover { background: var(--panel-hi); color: var(--ink); }
.palette button.on { background: var(--panel-hi); color: var(--ink); box-shadow: inset 3px 0 0 var(--brand); }
.palette .sw { width: 14px; height: 14px; border-radius: 4px; flex: none; border: 1px solid rgba(255,255,255,0.2); }
.palette small { margin-left: auto; color: var(--ink-dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }

.rooms-unused { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: 84px; width: 290px; max-height: calc(100% - 170px); padding: 12px; display: grid; gap: 8px; overflow-y: auto; align-content: start; }
.room { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: grid; gap: 5px; cursor: pointer; background: rgba(255,255,255,0.02); }
.room:hover { border-color: rgba(255,178,62,0.5); }
.room.sel { border-color: var(--brand); }
.room .hd { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.room .hd .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.room .hd small { margin-left: auto; font-weight: 500; color: var(--ink-dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.pill { font-family: var(--display); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; }
.pill.ok { background: rgba(95,212,155,0.18); color: var(--ok); }
.pill.bad { background: rgba(255,107,94,0.18); color: var(--bad); }
.pill.warn { background: rgba(255,178,62,0.18); color: var(--brand); }
.room ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-dim); }
.room li { display: flex; gap: 6px; align-items: baseline; }
.room li b { width: 14px; flex: none; text-align: center; font-weight: 700; }
.room li.ok b { color: var(--ok); }
.room li.bad b { color: var(--bad); }
.room li.warn b { color: var(--brand); }

.hintbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding: 8px 10px 8px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; max-width: calc(100% - 560px); }
.hintbar .k { font-family: var(--display); font-weight: 700; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--ink); }
.hintbar button { padding: 6px 10px; border-radius: 6px; background: var(--panel-hi); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.hintbar span { min-width: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 70px; padding: 9px 14px; font-size: 13.5px; border-radius: 9px; background: var(--panel-solid); border: 1px solid var(--brand); }

@media (max-width: 1100px) {
  .hintbar { max-width: calc(100% - 24px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); transform: none; bottom: auto; top: 140px; }
  .rooms-unused { width: 240px; }
}
@media (max-width: 760px) {
  .tools { width: 160px; }
  .tgrid { grid-template-columns: 1fr; }
  .rooms-unused { top: auto; bottom: max(12px, env(safe-area-inset-bottom, 0px)); max-height: 34%; width: calc(100% - 196px); }
  .stat:nth-child(n+3) { display: none; }
  .brand .sub { display: none; }
  .hintbar { display: none; }
}
.tip { margin: 0; font-size: 13px; color: var(--ink-dim); line-height: 1.45; padding: 2px 4px; }
.side { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: 84px; width: 300px; max-height: calc(100% - 170px); padding: 12px; display: grid; gap: 10px; overflow-y: auto; align-content: start; }
.side h2 { margin: 0; }
.steps, .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; color: var(--ink-dim); }
.steps li { display: flex; gap: 8px; align-items: flex-start; }
.steps li b { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 12px; border: 1px solid var(--line); color: var(--ink-dim); }
.steps li.now { color: var(--ink); } .steps li.now b { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 3px rgba(255,178,62,0.18); }
.steps li.done b { background: rgba(95,212,155,0.18); border-color: transparent; color: var(--ok); }
.checks li { display: flex; gap: 6px; align-items: baseline; } .checks li b { width: 14px; flex: none; text-align: center; }
.checks li.ok b { color: var(--ok); } .checks li.bad b { color: var(--bad); } .checks li.warn b { color: var(--brand); }
.play { width: 100%; padding: 9px 12px; border-radius: 8px; background: var(--brand); color: #142334; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
.play:disabled { opacity: 0.6; cursor: default; }
.sepx { height: 1px; background: var(--line); }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; padding: 3px 8px; border-radius: 6px; background: rgba(17,29,43,0.82); border: 1px solid var(--line); font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
@media (max-width: 760px) { .side { top: auto; bottom: max(12px, env(safe-area-inset-bottom, 0px)); max-height: 36%; width: calc(100% - 196px); } }
</style>

<canvas id="c" aria-label="Site planner"></canvas>
<div id="labels" aria-hidden="true"></div>

<div class="top">
  <div class="panel brand"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="3" width="34" height="34" rx="8" fill="#ffb23e"/><rect x="10" y="9" width="20" height="5" rx="1.5" fill="#142334"/><rect x="10" y="17" width="20" height="5" rx="1.5" fill="#142334"/><rect x="10" y="25" width="20" height="5" rx="1.5" fill="#142334"/><circle cx="26.5" cy="11.5" r="1.3" fill="#5fd49b"/><circle cx="26.5" cy="19.5" r="1.3" fill="#5fd49b"/><circle cx="26.5" cy="27.5" r="1.3" fill="#ffb23e"/></svg><div><h1>Site Planner</h1><div class="sub" data-i="sub">AMS-01 · Site layout</div></div></div>
  <div class="panel stats">
    <div class="stat"><span class="label" data-i="sChecks">Site checks</span><div class="v" id="vChecks">0</div></div>
    <div class="stat"><span class="label" data-i="sLight">Lighting</span><div class="v" id="vLight">0%</div><div class="bar"><i id="bLight"></i></div></div>
    <div class="stat"><span class="label" data-i="sFence">Fence security</span><div class="v" id="vFence">-</div></div>
    <div class="stat"><span class="label" data-i="sCost">Site cost</span><div class="v" id="vCost">€ 0</div></div>
  </div>
  <div class="panel right-tools">
    <button id="night" title="Day / night (N)" aria-label="Day or night"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    <button id="rotL" title="Rotate view (Q)" aria-label="Rotate view left"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v5h5"/></svg></button>
    <button id="rotR" title="Rotate view (E)" aria-label="Rotate view right"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
    <button id="lang">NL</button>
  </div>
</div>

<nav class="panel tools" aria-label="Site tools">
  <span class="label" data-i="tTools">Tools</span>
  <div class="tgrid" id="toolGrid"></div>
  <div class="sep"></div>
  <span class="label" id="palTitle"></span>
  <div class="palette" id="palette"></div>
</nav>

<aside class="panel side" aria-label="Visit and checks">
  <span class="label" data-i="visit">Customer visit</span>
  <ol class="steps" id="stepList"></ol>
  <button class="play" id="play">Play visit</button>
  <div class="sepx"></div>
  <span class="label" data-i="checks">Site checks</span>
  <ul class="checks" id="checkList"></ul>
</aside>

<div class="panel hintbar"><span id="hintTxt"></span></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
const SKIN = [0xf1c7a3, 0xd9a27a, 0xb07650, 0x8a5636, 0x5e3a24, 0xf5d5b8];
const HAIR = { black: 0x2a2320, brown: 0x6b4428, blonde: 0xd8b065, red: 0xa8492a, grey: 0xb8b8b4 };
function buildChar(def) {
  const L = def.look, root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const skin = SKIN[L.skin];
  // legs
  const legs = [];
  for (const s of [-1, 1]) {
    const hip = new THREE.Group(); hip.position.set(0.13 * s, 0.62, 0); body.add(hip);
    mesh(new THREE.CapsuleGeometry(0.12, 0.32, 4, 10), L.pants, hip, 0, -0.27, 0);
    mesh(rbox(0.2, 0.12, 0.3), 0x2a2a2e, hip, 0, -0.56, 0.04);
    legs.push(hip);
  }
  // torso
  const torso = mesh(new THREE.CapsuleGeometry(0.31, 0.34, 6, 16), L.shirt, body, 0, 1.0, 0); torso.scale.set(1.05, 1, 0.82);
  if (L.vest) { const v = mesh(new THREE.CylinderGeometry(0.335, 0.33, 0.48, 16), L.vest, body, 0, 0.98, 0); v.scale.z = 0.84;
    for (const y of [0.88, 1.06]) { const st = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.045, 16), 0xe8eef2, body, 0, y, 0, { emissive: 0x666666, emissiveIntensity: 0.3 }); st.scale.z = 0.85; } }
  if (L.stripe) { const st = mesh(new THREE.CylinderGeometry(0.335, 0.335, 0.08, 16), L.stripe, body, 0, 1.12, 0); st.scale.z = 0.85; }
  if (L.tie) { mesh(rbox(0.07, 0.3, 0.02), L.tie, body, 0, 1.08, 0.27); mesh(rbox(0.22, 0.14, 0.02), 0xf4f6f8, body, 0, 1.24, 0.25); }
  // arms
  const arms = [];
  for (const s of [-1, 1]) {
    const sho = new THREE.Group(); sho.position.set(0.38 * s, 1.24, 0); body.add(sho);
    mesh(new THREE.CapsuleGeometry(0.085, 0.36, 4, 8), L.shirt, sho, 0.03 * s, -0.24, 0);
    mesh(new THREE.SphereGeometry(0.09, 10, 8), skin, sho, 0.04 * s, -0.5, 0);
    sho.rotation.z = 0.1 * s;
    arms.push(sho);
  }
  if (L.acc.includes("epaulettes")) for (const s of [-1, 1]) mesh(rbox(0.16, 0.04, 0.2), 0xd8b065, body, 0.3 * s, 1.36, 0);
  // head
  const head = new THREE.Group(); head.position.set(0, 1.66, 0); body.add(head);
  mesh(new THREE.SphereGeometry(0.31, 20, 16), skin, head);
  mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.12, 10), skin, body, 0, 1.38, 0);
  for (const s of [-1, 1]) { mesh(new THREE.SphereGeometry(0.038, 8, 8), 0x1b1b1f, head, 0.11 * s, 0.03, 0.28); mesh(new THREE.SphereGeometry(0.05, 8, 8), skin, head, 0.3 * s, 0, 0); }
  mesh(new THREE.TorusGeometry(0.06, 0.012, 6, 12, Math.PI), 0x8a4a3a, head, 0, -0.08, 0.28).rotation.z = Math.PI;
  const hc = HAIR[L.hairC] ?? 0x2a2320;
  const cap = (r = 0.325, t = 0.5) => new THREE.SphereGeometry(r, 20, 12, 0, Math.PI * 2, 0, Math.PI * t);
  if (L.hair === "short") { const h = mesh(cap(), hc, head); h.rotation.x = -0.25; }
  if (L.hair === "side") { const h = mesh(cap(0.33, 0.48), hc, head); h.rotation.set(-0.3, 0, 0.15); }
  if (L.hair === "bun") { const h = mesh(cap(), hc, head); h.rotation.x = -0.3; mesh(new THREE.SphereGeometry(0.13, 12, 10), hc, head, 0, 0.26, -0.2); }
  if (L.hair === "ponytail") { const h = mesh(cap(), hc, head); h.rotation.x = -0.3; mesh(new THREE.CapsuleGeometry(0.08, 0.3, 4, 8), hc, head, 0, -0.08, -0.33).rotation.x = 0.4; }
  if (L.hair === "long") { const h = mesh(cap(0.335, 0.62), hc, head); h.rotation.x = -0.45; mesh(rbox(0.5, 0.42, 0.14), hc, head, 0, -0.18, -0.22); }
  if (L.hair === "curly") { for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2, r = 0.25; mesh(new THREE.SphereGeometry(0.11, 8, 6), hc, head, Math.cos(a) * r, 0.17 + (i % 2) * 0.05, Math.sin(a) * r - 0.04); } mesh(cap(0.3), hc, head, 0, 0.06, -0.02); }
  if (L.hat === "cap") { mesh(new THREE.CylinderGeometry(0.31, 0.33, 0.18, 18), L.hatC, head, 0, 0.24, 0); mesh(rbox(0.36, 0.035, 0.22), L.hatC, head, 0, 0.17, 0.33); mesh(rbox(0.12, 0.08, 0.02), 0xd8b065, head, 0, 0.26, 0.31); }
  if (L.hat === "helmet") { mesh(cap(0.35, 0.5), L.hatC, head, 0, 0.05, 0); const b = mesh(new THREE.TorusGeometry(0.35, 0.03, 6, 24), L.hatC, head, 0, 0.06, 0); b.rotation.x = Math.PI / 2; mesh(rbox(0.06, 0.06, 0.66), 0xe39a2a, head, 0, 0.38, 0); }
  if (L.hat === "beanie") { mesh(cap(0.335, 0.52), L.hatC, head, 0, 0.04, 0); mesh(new THREE.SphereGeometry(0.07, 8, 8), L.hatC, head, 0, 0.4, 0); }
  // accessories
  const A = L.acc, R = arms[1], Lh = arms[0];
  let pose = "swing";
  if (A.includes("headset")) { const t = mesh(new THREE.TorusGeometry(0.33, 0.025, 6, 20, Math.PI), 0x1e2329, head, 0, 0.02, 0); t.rotation.y = Math.PI / 2; t.rotation.x = 0; t.rotation.z = 0;
    mesh(new THREE.SphereGeometry(0.07, 8, 8), 0x1e2329, head, 0.31, 0, 0); mesh(new THREE.SphereGeometry(0.07, 8, 8), 0x1e2329, head, -0.31, 0, 0); mesh(rbox(0.02, 0.02, 0.22), 0x1e2329, head, 0.3, -0.08, 0.1).rotation.y = 0.3; }
  if (A.includes("badge") || A.includes("visitorbadge")) { mesh(rbox(0.12, 0.16, 0.02), A.includes("visitorbadge") ? 0xff6b5e : 0xffffff, body, -0.12, 0.98, 0.27); mesh(rbox(0.02, 0.22, 0.02), A.includes("visitorbadge") ? 0xff6b5e : 0x55d2f2, body, -0.12, 1.15, 0.27); }
  if (A.includes("toolbelt")) { const b = mesh(new THREE.TorusGeometry(0.31, 0.04, 6, 20), 0x5c3f28, body, 0, 0.7, 0); b.rotation.x = Math.PI / 2; b.scale.y = 0.85; mesh(rbox(0.14, 0.16, 0.1), 0x5c3f28, body, 0.28, 0.65, 0.12); }
  if (A.includes("laptop")) { pose = "carry1"; const g = new THREE.Group(); g.position.set(0.04, -0.52, 0.12); Lh.add(g); mesh(rbox(0.34, 0.03, 0.24), 0x8d969e, g); mesh(rbox(0.34, 0.24, 0.02), 0x2a3440, g, 0, 0.12, -0.12, { emissive: 0x2a6fa8, emissiveIntensity: 0.5 }); }
  if (A.includes("server")) { pose = "carry2"; mesh(rbox(0.6, 0.1, 0.42), 0x2a2f36, body, 0, 0.92, 0.5); mesh(rbox(0.04, 0.04, 0.02), 0x5fd49b, body, 0.22, 0.92, 0.72, { emissive: 0x5fd49b, emissiveIntensity: 1 }); }
  if (A.includes("multimeter")) { pose = "carry1"; mesh(rbox(0.14, 0.22, 0.06), 0xffb23e, Lh, 0.04, -0.58, 0.1); mesh(rbox(0.1, 0.07, 0.01), 0x203040, Lh, 0.04, -0.53, 0.135, { emissive: 0x5fd49b, emissiveIntensity: 0.6 }); }
  if (A.includes("wrench")) { const w = mesh(rbox(0.05, 0.4, 0.03), 0xa8b2bb, R, 0.04, -0.6, 0.06, { metalness: 0.6, roughness: 0.3 }); mesh(new THREE.TorusGeometry(0.06, 0.02, 6, 10, 4.5), 0xa8b2bb, w, 0, -0.22, 0); }
  if (A.includes("spool")) { pose = "carry1"; const s = mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.1, 16), 0xff7a2f, Lh, 0.05, -0.58, 0.08); s.rotation.z = Math.PI / 2; }

  else if (s.phase === 5) { animChar(visitor, now / 1000, false); guard2.rotation.y = Math.sin(s.t * 2) * 0.2; if (s.t > 2) { visitor.traverse(o => { if (o.material && o.material.color && o.material.color.getHex() === 0xff6b5e) o.visible = true; }); s.phase = 6; s.u = 0; s.t = 0; s.step = 5; renderSteps(); } }

  const btn = document.getElementById("play"); btn.textContent = seq ? t().playing : (vcar.visible ? t().again : t().play); btn.disabled = !!seq;

// ---------------- camera ----------------
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 900);

// ---------------- tools UI ----------------

  else if (tool === "place") { title.textContent = t().palPlace; pal.innerHTML = Object.keys(ITEMS).map(k => `<button data-k="${k}" class="${k === itemType ? "on" : ""}"><span class="sw" style="background:${ITEM_SW[k]}"></span>${t().items[k]}<small>€ ${ITEMS[k].cost.toLocaleString(lang === "nl" ? "nl-NL" : "en-GB")}</small></button>`).join(""); pal.querySelectorAll("button").forEach(b => b.onclick = () => { itemType = b.dataset.k; renderTools(); }); }

  else { title.textContent = tool === "erase" ? t().palErase : t().palSelect; pal.innerHTML = `<p class="tip">${tool === "erase" ? t().tipErase : t().tipSelect}</p>`; }
  document.getElementById("hintTxt").textContent = t().hint[tool];
  applyPools(); ghostG.clear();
}

// ---------------- input ----------------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
function groundAt(e) { const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); if (!ray.ray.intersectPlane(groundPlane, hit)) return null; return { x: hit.x, z: hit.z, i: Math.floor(hit.x), j: Math.floor(hit.z) }; }
const inPlot = (i, j) => i >= PX0 && i < PX1 && j >= PZ0 && j <= 26;
let drag = null, orbit = null, lastP = null, pinch = null; const ptrs = new Map();
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { drag = null; ghostG.clear(); const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); orbit = "pinch"; return; }
  if (e.button === 2 || e.button === 1 || e.altKey || e.shiftKey || tool === "select" || tool === "fence") { orbit = e.button === 1 || e.shiftKey ? "pan" : "rot"; lastP = { x: e.clientX, y: e.clientY }; return; }
  const c = groundAt(e); if (!c) return;
  if (tool === "place") { tryPlace(c); return; }
  drag = { start: c, end: c }; updateGhost(c);
});
canvas.addEventListener("pointermove", e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (orbit === "pinch" && ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); dG = THREE.MathUtils.clamp(dG * pinch / d, 20, 180); pinch = d; return; }
  if (orbit) { const dx = e.clientX - lastP.x, dy = e.clientY - lastP.y; lastP = { x: e.clientX, y: e.clientY };
    if (orbit === "rot") { azG -= dx * 0.006; elG = THREE.MathUtils.clamp(elG + dy * 0.004, 0.3, 1.45); } else { const s = dist * 0.0016; tG.x += (-dx * Math.cos(az) - dy * Math.sin(az)) * s; tG.z += (dx * Math.sin(az) - dy * Math.cos(az)) * s; } return; }
  const c = groundAt(e); if (drag && c) drag.end = c; updateGhost(c);
});
function endP(e) { ptrs.delete(e.pointerId); if (orbit) { if (!ptrs.size) orbit = null; return; } if (drag) { commitDrag(); drag = null; ghostG.clear(); } }
canvas.addEventListener("pointerup", endP); canvas.addEventListener("pointercancel", endP);
canvas.addEventListener("wheel", e => { e.preventDefault(); dG = THREE.MathUtils.clamp(dG * (1 + Math.sign(e.deltaY) * 0.1), 20, 180); }, { passive: false });
const ghostOk = new THREE.MeshBasicMaterial({ color: 0x5fd49b, transparent: true, opacity: 0.45, depthWrite: false });
const ghostBad = new THREE.MeshBasicMaterial({ color: 0xff6b5e, transparent: true, opacity: 0.45, depthWrite: false });
function snapItem(c) { const d = ITEMS[itemType]; const x = d.w % 2 ? Math.floor(c.x) + 0.5 : Math.round(c.x), z = d.d % 2 ? Math.floor(c.z) + 0.5 : Math.round(c.z); return { x: itemType === "bay" ? Math.round(c.x / 2.5) * 2.5 + 1.25 : x, z: itemType === "bay" ? Math.floor(c.z) + 0.5 : z }; }
function itemBlocked(o) { const d = ITEMS[o.type]; if (o.x < PX0 + 0.5 || o.x > PX1 - 0.5 || o.z < PZ0 + 0.5 || o.z > 26.5) return true; if (blockedAt(o.x, o.z, d.w / 2 - 0.1)) return true;
  return items.some(p => { const e = ITEMS[p.type]; return Math.abs(p.x - o.x) < (d.w + e.w) / 2 - 0.05 && Math.abs(p.z - o.z) < (d.d + e.d) / 2 - 0.05; }); }

  ghostG.clear(); if (!c) return;
  if (tool === "place") { const s = snapItem(c), o = { type: itemType, ...s }, d = ITEMS[itemType]; const bad = itemBlocked(o); flat(d.w, d.d, bad ? ghostBad : ghostOk, s.x, 0.09, s.z, ghostG); const m = itemModel(o); m.traverse(x => { if (x.material) { x.material = x.material.clone(); x.material.transparent = true; x.material.opacity = 0.55; } }); ghostG.add(m); return; }
  const a = drag ? drag.start : c, b = drag ? drag.end : c;
  const i0 = Math.min(a.i, b.i), i1 = Math.max(a.i, b.i), j0 = Math.min(a.j, b.j), j1 = Math.max(a.j, b.j);
  const mat = tool === "erase" ? ghostBad : new THREE.MeshBasicMaterial({ color: SURF[surf].c, transparent: true, opacity: 0.75, depthWrite: false });
  flat(i1 - i0 + 1, j1 - j0 + 1, mat, (i0 + i1 + 1) / 2, 0.1, (j0 + j1 + 1) / 2, ghostG);
}
function commitDrag() {
  const a = drag.start, b = drag.end; const i0 = Math.min(a.i, b.i), i1 = Math.max(a.i, b.i), j0 = Math.min(a.j, b.j), j1 = Math.max(a.j, b.j);
  if (tool === "paint") { for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) if (inPlot(i, j) && !blockedAt(i + 0.5, j + 0.5)) tiles.set(key(i, j), surf); }
  if (tool === "erase") { if (i0 === i1 && j0 === j1) { const k = items.findIndex(o => Math.abs(o.x - a.x) < ITEMS[o.type].w / 2 + 0.3 && Math.abs(o.z - a.z) < ITEMS[o.type].d / 2 + 0.3); if (k >= 0) items.splice(k, 1); else tiles.delete(key(a.i, a.j)); }
    else for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) tiles.delete(key(i, j)); }

function tryPlace(c) { const o = { type: itemType, ...snapItem(c) }; if (itemBlocked(o)) { toast(t().blocked); return; } items.push(o); render(); }

// ---------------- day / night ----------------
let night = false;
const dayFog = new THREE.Color(0xbfe0f4), nightFog = new THREE.Color(0x1b2a42);
function applyNight() {
  scene.background.copy(night ? skyNight : skyDay); scene.fog.color.copy(night ? nightFog : dayFog);
  hemi.intensity = night ? 0.22 : 0.7; hemi.color.set(night ? 0x8aa4d6 : 0xe6f4ff); sun.intensity = night ? 0.12 : 0.85; sun.color.set(night ? 0x9fb4e8 : 0xfff0d8);
  winMat.emissiveIntensity = night ? 0.9 : 0; lampHeads.forEach(h => h.material.emissiveIntensity = night ? 1.4 : 0);
  document.getElementById("night").classList.toggle("on", night); applyPools();
}

// ---------------- labels, toast, lang ----------------
const tmpV = new THREE.Vector3();
function placeLabels() { const w = innerWidth, h = innerHeight; label3.forEach(L => { tmpV.copy(L.p).project(camera); const vis = tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1; L.el.style.display = vis ? "" : "none"; if (vis) L.el.style.transform = `translate(${(tmpV.x * 0.5 + 0.5) * w}px, ${(-tmpV.y * 0.5 + 0.5) * h}px) translate(-50%, -100%)`; }); }
const toastEl = document.getElementById("toast"); let toastT = 0;
function toast(m) { toastEl.textContent = m; toastEl.hidden = false; toastT = 2.6; }
function applyLang() { document.documentElement.lang = lang; document.querySelectorAll("[data-i]").forEach(el => el.textContent = t()[el.dataset.i]); document.getElementById("lang").textContent = lang === "en" ? "NL" : "EN"; label3.forEach(L => L.el.textContent = t().labels[L.id]); renderTools(); render(); }
document.getElementById("lang").onclick = () => { lang = lang === "en" ? "nl" : "en"; applyLang(); };
document.getElementById("rotL").onclick = () => azG += Math.PI / 2;
document.getElementById("rotR").onclick = () => azG -= Math.PI / 2;
document.getElementById("night").onclick = () => { night = !night; applyNight(); };
document.getElementById("play").onclick = playVisit;
addEventListener("keydown", e => { const k = e.key.toLowerCase();
  if (k === "q") azG += Math.PI / 2; else if (k === "e") azG -= Math.PI / 2; else if (k === "n") { night = !night; applyNight(); }
  else if ("12345".includes(k) && k.length === 1) { tool = Object.keys(ICONS)[+k - 1]; renderTools(); } else if (k === "escape") { drag = null; ghostG.clear(); } });

// ---------------- loop ----------------
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < 700 ? 52 : 38; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
let prev = performance.now();
function frame(now) {
  const raw = Math.min(0.5, (now - prev) / 1000), dt = Math.min(0.05, raw); prev = now;
  az += (azG - az) * Math.min(1, dt * 7); el += (elG - el) * Math.min(1, dt * 7); dist += (dG - dist) * Math.min(1, dt * 5); target.lerp(tG, Math.min(1, dt * 5)); placeCam();
  tickVisit(raw, now);
  animChar(guard, now / 1000, false); if (!seq || seq.phase < 5) animChar(guard2, now / 1000, false);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.hidden = true; }
  placeLabels(); renderer.render(scene, camera); requestAnimationFrame(frame);
}
example(); applyLang(); applyNight();
requestAnimationFrame(frame);
</script>
